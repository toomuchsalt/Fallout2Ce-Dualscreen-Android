name: Build

# Android APK and native ARM64 Linux package for Armada / AYN Thor.
# Pushes to main replace the latest pre-release; v* tags make permanent releases.
# One publishing job collects both artifacts so neither build can overwrite
# the other platform's release assets.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    types:
      - opened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  code-format:
    name: Code format check
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: clang-format
        run: |
          clang-format --version
          find src -type f \( -name \*.cc -o -name \*.h \) | xargs clang-format --dry-run --Werror

  android:
    name: Android APK
    runs-on: ubuntu-latest
    outputs:
      signing: ${{ steps.signing.outputs.signing }}

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Cache cmake build
        uses: actions/cache@v4
        with:
          path: os/android/app/.cxx
          key: android-cmake-dual-v1

      # A stable signing key from the repo secrets (THOR_KEYSTORE_B64, the
      # keystore in base64, and THOR_KEYSTORE_PASSWORD), so each APK installs
      # over the last one. Without them the APK is signed with a one-off key:
      # it still installs, but the next one needs the old one uninstalled.
      - name: Signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.THOR_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.THOR_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # Pasted secrets often carry a stray newline or space.
            PW=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \t\r\n')
            printf '%s' "$KEYSTORE_B64" | tr -d ' \t\r\n' | base64 -d > os/android/thor.keystore
            if ! keytool -list -keystore os/android/thor.keystore -storepass "$PW" -alias fallout2thor > /dev/null; then
              echo "::error::THOR_KEYSTORE_B64 / THOR_KEYSTORE_PASSWORD don't open the key: re-paste both secrets"
              exit 1
            fi
            {
              echo "storeFile=thor.keystore"
              echo "storePassword=$PW"
              echo "keyAlias=fallout2thor"
              echo "keyPassword=$PW"
            } > os/android/debug-keystore.properties
            echo "signing=stable" >> "$GITHUB_OUTPUT"
            echo "stable signing key: yes"
          else
            echo "signing=one-off" >> "$GITHUB_OUTPUT"
            echo "::warning::No THOR_KEYSTORE_B64 / THOR_KEYSTORE_PASSWORD secrets: this APK uses a one-off key"
          fi

      # The phone build: optimized native code, what is played and tested.
      - name: Build APK
        run: |
          cd os/android
          ./gradlew --no-daemon assemblePhone

      - name: Collect APK
        run: |
          mkdir -p out
          cp os/android/app/build/outputs/apk/phone/app-phone.apk out/Fallout2-Dualscreen.apk
          (cd out && sha256sum Fallout2-Dualscreen.apk > Fallout2-Dualscreen.apk.sha256)
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --verbose out/Fallout2-Dualscreen.apk
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fallout2-Dualscreen-apk
          path: out/Fallout2-Dualscreen.apk*
          if-no-files-found: error

  armada:
    name: Armada Linux (aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libsdl2-dev zlib1g-dev python3 binutils

      - name: Build and stage Armada package
        run: |
          test "$(uname -m)" = aarch64
          cmake --preset armada -B out/build/armada-aarch64 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFALLOUT_APP_VERSION="armada-${GITHUB_SHA::7}"
          cmake --build out/build/armada-aarch64 \
            --target fallout2-ce fallout2-companion fallout2-setup --parallel 2
          cmake --install out/build/armada-aarch64 \
            --prefix "$PWD/out/stage/armada-aarch64/Fallout2-Armada" --strip

      - name: Collect Armada archive
        run: |
          for binary in fallout2-ce fallout2-companion; do
            readelf -h "out/stage/armada-aarch64/Fallout2-Armada/bin/$binary" | grep -q 'Machine:.*AArch64'
          done
          mkdir -p out/armada
          readelf -h "out/stage/armada-aarch64/Fallout2-Armada/Install Fallout 2" | grep -q 'Machine:.*AArch64'
          tar -C out/stage/armada-aarch64 -czf out/armada/Fallout2-Dualscreen-Armada-aarch64.tar.gz Fallout2-Armada
          (cd out/armada && sha256sum Fallout2-Dualscreen-Armada-aarch64.tar.gz > Fallout2-Dualscreen-Armada-aarch64.tar.gz.sha256)

      - name: Upload Armada package
        uses: actions/upload-artifact@v4
        with:
          name: Fallout2-Dualscreen-armada-aarch64
          path: out/armada/Fallout2-Dualscreen-Armada-aarch64.tar.gz*
          if-no-files-found: error

  publish:
    name: Publish Android and Armada releases
    needs: [android, armada]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: Fallout2-Dualscreen-apk
          path: out

      - name: Download Armada package
        uses: actions/download-artifact@v4
        with:
          name: Fallout2-Dualscreen-armada-aarch64
          path: out

      - name: Verify artifact checksums
        run: |
          cd out
          sha256sum -c Fallout2-Dualscreen.apk.sha256
          sha256sum -c Fallout2-Dualscreen-Armada-aarch64.tar.gz.sha256

      - name: Publish as the latest build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING: ${{ needs.android.outputs.signing }}
        run: |
          if [ "$SIGNING" = "stable" ]; then
            SIGN_NOTE="Signed with the port's stable key: installs over earlier builds."
          else
            SIGN_NOTE="Signed with a one-off key (no signing secrets set yet): uninstall the previous build before installing this one."
          fi
          cat > notes.md <<EOF
          Built automatically from ${GITHUB_SHA::7}: $(git log -1 --format=%s)

          Fallout 2 Community Engine for dual-screen devices such as the AYN Thor.

          - Android: Fallout2-Dualscreen.apk. Installs beside the original app. ${SIGN_NOTE}
          - Armada OS: Fallout2-Dualscreen-Armada-aarch64.tar.gz. Native ARM64 Linux build; extract the archive, open Fallout2-Armada, and double-click Install Fallout 2. No terminal or system package installation is needed.
          - Armada installation and controls: https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/armada-installation.md

          No game data inside: you need your own copy of Fallout 2.

          Free and non-commercial, under the Sustainable Use License (LICENSE.md).
          EOF
          sed -i 's/^          //' notes.md
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/Fallout2-Dualscreen.apk out/Fallout2-Dualscreen.apk.sha256 out/Fallout2-Dualscreen-Armada-aarch64.tar.gz out/Fallout2-Dualscreen-Armada-aarch64.tar.gz.sha256 --prerelease --target "$GITHUB_SHA" \
            --title "Latest build ($(date -u +%Y-%m-%d) ${GITHUB_SHA::7})" \
            --notes-file notes.md

      - name: Publish the release for a version tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" out/Fallout2-Dualscreen.apk out/Fallout2-Dualscreen.apk.sha256 out/Fallout2-Dualscreen-Armada-aarch64.tar.gz out/Fallout2-Dualscreen-Armada-aarch64.tar.gz.sha256 --clobber
          else
            gh release create "$TAG" out/Fallout2-Dualscreen.apk out/Fallout2-Dualscreen.apk.sha256 out/Fallout2-Dualscreen-Armada-aarch64.tar.gz out/Fallout2-Dualscreen-Armada-aarch64.tar.gz.sha256 --verify-tag \
              --title "Fallout 2 Dualscreen $TAG" --generate-notes
          fi
